<mat-card class="form-card p-10!">
  <mat-card-title>Employee Form</mat-card-title>

  <form
    [formGroup]="employeeForm"
    class="grid grid-cols-2 gap-6"
    (ngSubmit)="submit()"
  >
    <mat-form-field>
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Phone</mat-label>
      <input matInput formControlName="phone" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Job Title</mat-label>
      <input matInput formControlName="jobTitle" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Gender</mat-label>
      <mat-select formControlName="gender">
        <mat-option value="Male">Male</mat-option>
        <mat-option value="Female">Female</mat-option>
        <mat-option value="Other">Other</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Department</mat-label>
      <mat-select formControlName="departmentId">
        <mat-option *ngFor="let dep of departments" [value]="dep.id">
          {{ dep.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Joining Date</mat-label>
      <input
        matInput
        [matDatepicker]="joinPicker"
        formControlName="joiningDate"
      />
      <mat-datepicker-toggle
        matSuffix
        [for]="joinPicker"
      ></mat-datepicker-toggle>
      <mat-datepicker #joinPicker></mat-datepicker>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Last Working Date</mat-label>
      <input
        matInput
        [matDatepicker]="lastPicker"
        formControlName="lastWorkingDate"
      />
      <mat-datepicker-toggle
        matSuffix
        [for]="lastPicker"
      ></mat-datepicker-toggle>
      <mat-datepicker #lastPicker></mat-datepicker>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Date of Birth</mat-label>
      <input
        matInput
        [matDatepicker]="dobPicker"
        formControlName="dateOfBirth"
      />
      <mat-datepicker-toggle
        matSuffix
        [for]="dobPicker"
      ></mat-datepicker-toggle>
      <mat-datepicker #dobPicker></mat-datepicker>
    </mat-form-field>

    <div class="col-span-2 mt-4 flex justify-center">
      <button
        mat-raised-button
        class="bg-green-500! text-white! font-semibold cursor-pointer!"
        [disabled]="employeeForm.invalid"
      >
        Save Employee
      </button>
    </div>   
  </form>
</mat-card>
